<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@700;900&display=swap" rel="stylesheet">
<title>Galería de FERXDESING</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2232%22 fill=%22%230a0a0a%22/%3E%3Ctext x=%2232%22 y=%2243%22 text-anchor=%22middle%22 font-family=%22Arial Black%2CArial%2CHelvetica%2Csans-serif%22 font-weight=%22900%22 font-size=%2230%22 letter-spacing=%22-2%22 fill=%22%2302DF00%22%3EGF%3C/text%3E%3C/svg%3E" />
<style>
  :root{--cream:#FEECBC;--char:#210E10;--ash:#6B6064;--paper:#E8E7E3;--red:#FA5E4D;--orange:#F57E30}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;height:100vh;height:100dvh;background:#060304;color:var(--cream);user-select:none;-webkit-user-select:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;touch-action:pan-y}
  html{height:100%;overflow:hidden;touch-action:manipulation}
  button,a,[role="button"],.circular-gallery,.circular-gallery-canvas,.rail,.flip-overlay,.flip-card,.flip-face,.flip-x,.page,.btn,#galeria{
    -webkit-tap-highlight-color:transparent!important;-webkit-touch-callout:none;outline:none;
  }
  @media (pointer:coarse){
    button:focus,button:focus-visible,a:focus,.circular-gallery:focus,.rail:focus{outline:none!important;box-shadow:none}
  }
  .page{position:absolute;inset:0;background:var(--paper);z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .page.burn{background:transparent}
  .page.burn .title,.page.burn .btn,.page.burn .hint{visibility:hidden}
  .title{color:var(--char);font-size:clamp(1.5rem,7.2vw,3.4rem);font-weight:900;margin-bottom:clamp(24px,4vh,40px);letter-spacing:-.045em;white-space:nowrap;text-align:center}
  .btn{position:relative;padding:clamp(15px,2.2vh,19px) clamp(52px,12vw,76px);min-height:48px;border-radius:999px;border:none;background:var(--char);color:var(--cream);font-size:clamp(1rem,2.4vw,1.2rem);font-weight:900;letter-spacing:-.01em;cursor:pointer;overflow:hidden;z-index:5;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .7s}
  @media (hover:hover){.btn:hover:not(.active){transform:scale(1.03)}}
  .btn:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
  .fire{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,#009A0A,#02DF00,#D9FFC7);transform:scaleX(0);transform-origin:left center;transition:transform 1.1s cubic-bezier(.4,0,.12,1);z-index:-1}
  .btn.active .fire{transform:scaleX(1)}
  .btn .text{position:relative;z-index:2;transition:opacity .5s,transform .5s,filter .5s}
  .btn.active .text{color:var(--char)}
  .btn.fading .text{opacity:0;transform:scale(.88);filter:blur(2px)}
  .btn.active{box-shadow:0 0 22px rgba(2,223,0,.5),0 0 50px rgba(2,223,0,.25)}

  #gl,#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #gl{z-index:8;display:none}#fx{z-index:12}
  .hint{position:absolute;bottom:calc(42px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);color:var(--ash);font-size:.8rem;z-index:3;transition:opacity .5s}
  .hint.hidden{opacity:0}

  /* ===== Galería (CircularGallery de React Bits) ===== */
.circular-gallery {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
  cursor: grab;
}

.circular-gallery[data-pointer] {
  cursor: pointer;
}

.circular-gallery[data-dragging] {
  cursor: grabbing;
}

.circular-gallery-canvas {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
}

.circular-gallery-labels {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.circular-gallery-label {
  position: absolute;
  top: 0;
  left: 0;
  line-height: 1.15;
  white-space: pre-line;
  text-align: center;
  max-width: 11em;
  will-change: transform, opacity;
}

.circular-gallery-caption {
  position: absolute;
  top: 0;
  left: 50%;
  width: min(90%, 36rem);
  text-align: center;
  opacity: 0;
  pointer-events: none;
}

.circular-gallery-caption-text {
  margin: 0;
  line-height: 1.5;
  opacity: 0.65;
}

.circular-gallery-close {
  position: absolute;
  top: 12px;
  right: 12px;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: inherit;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}

.circular-gallery-close[data-visible] {
  opacity: 0.8;
  pointer-events: auto;
}

.circular-gallery-close:hover {
  opacity: 1;
}

.circular-gallery-close:focus-visible {
  outline: 2px solid currentColor;
  outline-offset: 2px;
}

.circular-gallery-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

  .circular-gallery-label{letter-spacing:-.03em;text-wrap:balance}
  .galeria{position:absolute;inset:0;z-index:1;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:transparent;opacity:0;pointer-events:none;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#3a2a2c transparent}
  .galeria.visible{pointer-events:auto}
  .g-page{max-width:1120px;margin:0 auto;padding:calc(54px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) calc(130px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px))}
  .g-title{text-align:center;text-transform:uppercase;font-size:clamp(2.2rem,6vw,4rem);font-weight:900;line-height:.95;letter-spacing:-.05em;color:var(--cream)}
  .cat h2{text-transform:uppercase;font-size:clamp(1.3rem,3vw,2rem);font-weight:900;letter-spacing:-.045em;color:var(--cream);margin:58px 0 4px}
  .rail{position:relative;height:clamp(340px,58vh,500px);height:clamp(340px,58dvh,640px)}
  .rail:focus-visible{outline:2px solid var(--orange);outline-offset:4px;border-radius:12px}

  /* ===== Flip card overlay ===== */
  .flip-overlay{
    position:fixed;inset:0;z-index:40;
    display:grid;place-items:center;
    background:rgba(6,3,4,.72);
    backdrop-filter:blur(10px);
    opacity:0;pointer-events:none;
    transition:opacity .35s ease;
  }
  .flip-overlay[data-open]{opacity:1;pointer-events:auto}
  .flip-stage{perspective:1400px}
  .flip-card{
    position:relative;width:100%;height:100%;
    transform-style:preserve-3d;
    transition:transform .7s cubic-bezier(.2,.8,.2,1);
  }
  .flip-card[data-flipped]{transform:rotateY(180deg)}
  .flip-face{
    position:absolute;inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 24px 80px rgba(0,0,0,.55);
  }
  .flip-front{
    background:#210E10;
  }
  .flip-front img{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .flip-front .flip-title{
    position:absolute;left:0;right:0;bottom:0;
    padding:28px 18px 18px;
    background:linear-gradient(transparent,rgba(6,3,4,.92));
    color:var(--cream);font-weight:900;font-size:1.15rem;
    letter-spacing:-.03em;
  }
  .flip-back{
    background:linear-gradient(165deg,#241014 0%,#140a0c 55%,#0c0608 100%);
    transform:rotateY(180deg);
    display:flex;flex-direction:column;
    padding:22px 20px 18px;
    color:var(--cream);
  }

  .flip-back h3{
    font-size:1.05rem;font-weight:900;letter-spacing:-.03em;
    margin:0 0 10px;color:var(--cream);
  }
  .flip-back .flip-label{
    font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;
    color:var(--ash);margin-bottom:8px;font-weight:700;
  }
  .flip-back .flip-prompt{
    flex:1;overflow:auto;
    font-size:.88rem;line-height:1.55;font-weight:500;
    color:#e8d9c8;white-space:pre-wrap;word-break:break-word;
    padding-right:4px;margin-bottom:14px;
    scrollbar-width:thin;scrollbar-color:#3a2a2c transparent;
  }
  .flip-actions{display:flex;gap:10px;flex-shrink:0}
  .flip-actions button{
    flex:1;padding:12px 14px;border-radius:999px;border:1px solid #3a2a2c;
    background:transparent;color:var(--cream);font-family:inherit;
    font-size:.82rem;font-weight:900;cursor:pointer;
    transition:border-color .2s,background .2s,color .2s;
  }
  .flip-actions button:hover{border-color:var(--orange)}
  .flip-actions .flip-copy{
    background:var(--cream);color:var(--char);border-color:var(--cream);
  }
  .flip-actions .flip-copy:hover{background:#fff;border-color:#fff}
  .flip-actions .flip-copy[data-ok]{background:var(--orange);border-color:var(--orange);color:#fff}

  .flip-tips-bar{
    display:flex;align-items:center;justify-content:space-between;
    gap:8px;flex-shrink:0;margin-bottom:8px;
  }
  .flip-tips-btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 12px;border-radius:999px;
    border:1px solid rgba(254,236,188,.18);
    background:rgba(254,236,188,.06);
    color:rgba(254,236,188,.72);
    font-family:inherit;font-size:.68rem;font-weight:700;
    letter-spacing:.04em;text-transform:uppercase;
    cursor:pointer;transition:background .2s,border-color .2s,color .2s,transform .2s;
  }
  .flip-tips-btn:hover,.flip-tips-btn[aria-expanded="true"]{
    background:rgba(254,236,188,.12);
    border-color:rgba(245,126,48,.5);
    color:var(--cream);
  }
  .flip-tips-btn[aria-expanded="true"]{transform:scale(1.03)}
  .flip-demo-steps{
    display:none;gap:6px;flex-wrap:wrap;
    flex-shrink:0;margin:0 0 10px;
  }
  .flip-demo-steps[data-open]{display:flex;animation:demoIn .3s ease}
  @keyframes demoIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .flip-demo-step{
    font-size:.62rem;font-weight:700;letter-spacing:.02em;
    padding:5px 9px;border-radius:999px;cursor:pointer;
    border:1px solid rgba(254,236,188,.12);
    background:transparent;color:rgba(254,236,188,.55);
    font-family:inherit;
    transition:background .2s,border-color .2s,color .2s;
  }
  .flip-demo-step:hover{color:var(--cream);border-color:rgba(254,236,188,.28)}
  .flip-demo-step[data-active]{
    background:rgba(245,126,48,.16);
    border-color:rgba(245,126,48,.45);
    color:var(--cream);
  }
  .flip-demo-hint{
    display:none;font-size:.7rem;line-height:1.4;
    color:rgba(254,236,188,.5);margin:0 0 10px;min-height:1.4em;
  }
  .flip-demo-hint[data-open]{display:block;animation:demoIn .3s ease}

  .flip-mode{
    display:none;gap:6px;flex-wrap:wrap;margin:0 0 8px;
  }
  .flip-mode[data-show]{display:flex}
  .flip-mode button{
    font-size:.62rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
    padding:5px 10px;border-radius:999px;cursor:pointer;font-family:inherit;
    border:1px solid rgba(254,236,188,.14);
    background:transparent;color:rgba(254,236,188,.55);
    transition:background .2s,border-color .2s,color .2s;
  }
  .flip-mode button:hover{color:var(--cream);border-color:rgba(254,236,188,.3)}
  .flip-mode button[data-active]{
    background:rgba(245,126,48,.16);border-color:rgba(245,126,48,.45);color:var(--cream);
  }
  .flip-prompt[data-json]{
    font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
    font-size:.72rem;line-height:1.45;
  }
  .flip-prompt .hl{
    color:var(--orange);
    background:rgba(245,126,48,.14);
    border-radius:4px;padding:0 3px;
    box-decoration-break:clone;-webkit-box-decoration-break:clone;
  }
  .flip-prompt .hl-in{
    display:inline;
    opacity:0;filter:blur(3px);transform:translateX(8px);
    animation:hlIn .5s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes hlIn{to{opacity:1;filter:none;transform:none}}

  .flip-x{
    position:absolute;top:14px;right:14px;z-index:5;
    width:40px;height:40px;border:0;border-radius:50%;
    background:rgba(6,3,4,.45);color:var(--cream);
    display:grid;place-items:center;cursor:pointer;
    backdrop-filter:blur(6px);
  }
  .flip-x:hover{background:rgba(6,3,4,.7)}
  .flip-hint{
    position:absolute;left:10px;top:50%;
    transform:translateY(-50%);
    z-index:5;
    width:10px;height:10px;
    border-radius:50%;
    background:rgba(255,255,255,.28);
    box-shadow:0 0 0 1px rgba(255,255,255,.18), 0 0 10px rgba(255,255,255,.12);
    pointer-events:none;
    animation:flipHintPulse 2.4s ease-in-out infinite;
  }
  @keyframes flipHintPulse{
    0%,100%{opacity:.55;transform:translateY(-50%) scale(1)}
    50%{opacity:.95;transform:translateY(-50%) scale(1.15)}
  }

  /* ===== Fondo 3D (escena Mesa · Lámpara) ===== */
  #bg3d{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
  #bgdim{position:absolute;inset:0;pointer-events:none;z-index:0;background:rgba(0,0,0,.65)}   /* capa negra sutil sobre la escena */
  #bgvig{position:absolute;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 50% 48%,transparent 35%,rgba(0,0,0,.7) 100%)}
  /* Scroll más largo: el recorrido termina donde acaba Ilustraciones. Ajusta el 20vh de abajo a gusto */
  .cat + .cat{margin-top:20vh;margin-top:20dvh}
  .flip-prompt{user-select:text;-webkit-user-select:text}
  /* ===== Pantalla de carga ===== */
  #loader{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#060304;color:var(--cream);transition:opacity .6s ease,visibility .6s;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
  #loader.done{opacity:0;visibility:hidden;pointer-events:none}
  .ld-in{width:min(78vw,340px);text-align:center}
  .ld-brand{font-weight:900;font-size:clamp(1.6rem,7vw,2.4rem);letter-spacing:-.04em;margin-bottom:22px}
  .ld-bar{height:4px;border-radius:99px;background:rgba(254,236,188,.14);overflow:hidden}
  .ld-bar i{display:block;height:100%;width:100%;transform-origin:left center;transform:scaleX(0);background:linear-gradient(90deg,#009A0A,#02DF00,#D9FFC7);box-shadow:0 0 14px rgba(2,223,0,.5)}
  .ld-txt{margin-top:14px;font-size:.8rem;font-weight:700;color:var(--ash);letter-spacing:.02em}
  /* ===== Responsive ===== */
  @media (min-width:1200px){.g-page{max-width:1400px}.rail{height:clamp(440px,62dvh,680px)}}
  @media (max-width:700px){
    .g-page{padding-top:calc(28px + env(safe-area-inset-top,0px));padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
    .g-title{font-size:clamp(2rem,9vw,3.2rem);margin-bottom:8px}
    .cat h2{margin:22px 0 2px}
    .rail{height:clamp(420px,68dvh,620px)}
    .cat + .cat{margin-top:8dvh}
    /* Sin degradado lateral en el carrusel: las tarjetas llegan limpio al borde */
    .circular-gallery{--no-edge-fade:1}
  }
  @media (orientation:landscape) and (max-height:520px){
    .g-page{padding-top:22px}
    .g-title br{display:none}
    .cat h2{margin:26px 0 0}
    .rail{height:clamp(230px,82dvh,380px)}
    .cat + .cat{margin-top:8dvh}
  }
  /* tarjeta de prompt (flip) */
  .flip-stage{width:min(92vw,420px);height:min(78vh,600px);height:min(78dvh,600px)}
  @media (min-width:900px){.flip-stage{width:min(40vw,460px);height:min(82dvh,680px)}}
  @media (orientation:landscape) and (max-height:520px){
    .flip-stage{width:min(88vw,640px);height:92dvh}
    .flip-front img{object-fit:contain}
    .flip-back{padding:14px 16px 12px}
    .flip-back h3{margin-bottom:6px;font-size:.95rem}
  }
  /* dedos: botones cómodos de tocar */
  @media (pointer:coarse){
    .flip-actions button{min-height:46px}
    .flip-tips-btn{padding:9px 14px;font-size:.72rem}
    .flip-demo-step,.flip-mode button{padding:8px 13px;font-size:.7rem}
    .flip-x{width:44px;height:44px}
  }
  @media (prefers-reduced-motion:reduce){.flip-card{transition-duration:.01s}.flip-hint{animation:none}}   /* el espacio va ENTRE Fotografía e Ilustraciones, no arriba: la pantalla de inicio queda compacta */
</style>
</head>
<body>
  <div id="loader" role="status" aria-live="polite"><div class="ld-in"><div class="ld-brand">FERXDESING</div><div class="ld-bar"><i id="ldBar"></i></div><div class="ld-txt" id="ldTxt">Cargando… 0%</div></div></div>
  <canvas id="bg3d"></canvas><div id="bgdim"></div><div id="bgvig"></div>
  <section class="galeria" id="galeria" aria-label="Galería de prompt">
    <div class="g-page">
      <h1 class="g-title">Galería de<br>prompt</h1>
      <section class="cat"><h2>Fotografía</h2><div class="rail" id="railFoto"></div></section>
      <section class="cat"><h2>Ilustraciones</h2><div class="rail" id="railIlu"></div></section>
    </div>
  </section>

  <div class="page" id="page">
    <div class="title">Galería de FERXDESING</div>
    <button class="btn" id="btn"><div class="fire"></div><span class="text">Entrar</span></button>
    <div class="hint" id="hint">Haz clic en Entrar</div>
  </div>

  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>

  <div class="flip-overlay" id="flipOverlay" aria-hidden="true">
    <button class="flip-x" id="flipClose" type="button" aria-label="Cerrar">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <div class="flip-stage">
      <div class="flip-card" id="flipCard">
        <div class="flip-face flip-front">
          <span class="flip-hint" aria-hidden="true"></span>
          <img id="flipImg" alt="" />
          <div class="flip-title" id="flipTitle"></div>
        </div>
        <div class="flip-face flip-back" id="flipBackFace">
          <div class="flip-tips-bar">
            <div class="flip-label" style="margin:0">Prompt</div>
            <button type="button" class="flip-tips-btn" id="flipTipsBtn" aria-expanded="false" aria-controls="flipDemoSteps">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><circle cx="6" cy="6" r="5.2" stroke="currentColor" stroke-width="1.2"/><path d="M6 5.2v3.2M6 3.6h.01" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
              Consejos
            </button>
          </div>
          <h3 id="flipBackTitle"></h3>
          <div class="flip-demo-steps" id="flipDemoSteps">
            <button type="button" class="flip-demo-step" data-step="0">Original</button>
            <button type="button" class="flip-demo-step" data-step="1">Escena</button>
            <button type="button" class="flip-demo-step" data-step="2">Imagen</button>
            <button type="button" class="flip-demo-step" data-step="3">Calidad</button>
          </div>
          <div class="flip-demo-hint" id="flipDemoHint"></div>
          <div class="flip-mode" id="flipMode">
            <button type="button" data-mode="normal" data-active>Normal</button>
            <button type="button" data-mode="json">JSON avanzado</button>
          </div>
          <div class="flip-prompt" id="flipPrompt"></div>
          <div class="flip-actions">
            <button type="button" id="flipBackBtn">Volver</button>
            <button type="button" class="flip-copy" id="flipCopyBtn">Copiar prompt</button>
          </div>
        </div>
      </div>
    </div>
  </div>


<script>
const $=id=>document.getElementById(id);
const glC=$("gl"),fxC=$("fx"),fx=fxC.getContext("2d"),btn=$("btn"),page=$("page"),hint=$("hint");
const IS_MOBILE = (()=>{try{return matchMedia("(pointer:coarse)").matches||Math.min(innerWidth,innerHeight)<700}catch(_){return false}})();
const SP=1.7,DUR=IS_MOBILE?2.35:3.1;
const MAX_PS=IS_MOBILE?28:120;
const FLECK_N=IS_MOBILE?1:5;
const EMBER_P=IS_MOBILE?0.28:0.7;
let tex,W,H,dpr,phase="idle",t0=0,org=[.5,.5],ps=[],last=0,gl,prog,U,prog_t=0;

function resize(){
  dpr=IS_MOBILE?1:Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;

// ===== Giroscopio: se activa al pulsar Entrar (iOS pide permiso en ese gesto) =====
window.__gyro={beta:0,gamma:0,ok:false,rawB:0,rawG:0};
function __onOrient(e){
  if(e.beta==null||e.gamma==null)return;
  // beta: inclinar adelante/atrás · gamma: izquierda/derecha
  window.__gyro.rawB=Math.max(-35,Math.min(35,e.beta-45)); // centrado al sujetar el teléfono
  window.__gyro.rawG=Math.max(-30,Math.min(30,e.gamma));
}
async function enableGyro(){
  if(window.__gyro.ok)return true;
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
      const p=await DeviceOrientationEvent.requestPermission();
      if(p!=='granted')return false;
    }
    window.addEventListener('deviceorientation',__onOrient,true);
    window.__gyro.ok=true;
    return true;
  }catch(_){return false}
}
// suavizado continuo
(function gyroSmooth(){
  const g=window.__gyro;
  g.beta+=(g.rawB-g.beta)*.08;
  g.gamma+=(g.rawG-g.gamma)*.08;
  requestAnimationFrame(gyroSmooth);
})();

const VS=`#version 300 es
in vec2 a_pos;out vec2 v_uv;
void main(){v_uv=a_pos*.5+.5;gl_Position=vec4(a_pos,0.,1.);}`;

const FS=`#version 300 es
precision highp float;
in vec2 v_uv;out vec4 fragColor;
uniform float u_time,u_spread,u_aspect,u_clock;
uniform vec2 u_origin;
uniform sampler2D u_tex;   // título y botón de la página, para quemarlos con el papel

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
vec2 hash2(vec2 p){return fract(sin(vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3))))*43758.5453);}
float noise(vec2 p){
  vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
}
float fbm(vec2 p){float v=0.,a=.5;mat2 m=mat2(1.6,1.2,-1.2,1.6);for(int i=0;i<5;i++){v+=a*noise(p);p=m*p;a*=.5;}return v;}
// Voronoi: F1 y F2 -> (F2-F1) da la distancia al borde de la celda = grietas
vec2 vor(vec2 p){
  vec2 i=floor(p),f=fract(p);float d1=8.,d2=8.;
  for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){
    vec2 g=vec2(x,y);float d=length(g+hash2(i+g)-f);
    if(d<d1){d2=d1;d1=d;}else if(d<d2)d2=d;
  }
  return vec2(d1,d2);
}

// rampa de color: carbón -> rojo oscuro -> rojo -> naranja -> crema
vec3 ramp(float t){
  vec3 c=mix(vec3(.13,.055,.063),vec3(.02,.30,.07),smoothstep(0.,.25,t));
  c=mix(c,vec3(0.,.60,.04),smoothstep(.2,.5,t));
  c=mix(c,vec3(.008,.875,0.),smoothstep(.45,.75,t));
  return mix(c,vec3(.85,1.,.78),smoothstep(.75,1.,t));
}

void main(){
  vec2 uv=v_uv,ap=vec2(uv.x*u_aspect,uv.y);
  vec2 p=(uv-u_origin)*vec2(u_aspect,1.);
  float T=u_clock;
  float big=fbm(ap*3.+vec2(1.3,-T*.15));
  float mid=fbm(ap*9.+vec2(4.,T*.2));
  float fine=fbm(ap*26.);
  float grain=hash(floor(gl_FragCoord.xy*.5));

  float d=length(p)+(big-.5)*.30+(mid-.5)*.05+(fine-.5)*.03+(fbm(ap*14.+2.)-.5)*.02-u_time*u_spread; // <0 quemado
  const vec3 cream=vec3(.85,1.,.78),red=vec3(0.,.60,.04),orng=vec3(.008,.875,0.);
  vec3 col;float a=1.;

  if(d>=0.){
    col=vec3(.91,.906,.89)*(.93+.07*uv.y);
    // contenido de la página (título, botón): se desintegra un poco antes que el papel
    vec4 ct=texture(u_tex,uv);
    float ca=ct.a*smoothstep(0.,.05,d+(grain-.5)*.02);
    col=mix(col,ct.rgb,ca);
    col+=ramp(.55+.35*grain)*ct.a*exp(-d*35.)*.9;   // se enciende al llegar el fuego
    // papel chamuscándose: amarillea -> tostado -> marrón -> carbón, con fibras y grano
    float fib=fbm(vec2(ap.x*70.,ap.y*9.));
    float sc=d+(fib-.5)*.03+(grain-.5)*.008;
    col=mix(col,vec3(.80,.80,.56),smoothstep(.16,.07,sc)*.8);
    col=mix(col,vec3(.55,.47,.20),smoothstep(.09,.04,sc)*.9);
    col=mix(col,vec3(.27,.21,.07),smoothstep(.045,.015,sc));
    col=mix(col,vec3(.09,.08,.04),smoothstep(.02,0.,sc)*(.6+.4*grain));
    // moteado rosado-arenoso del borde
    col=mix(col,vec3(.58,.54,.30),step(.62,grain)*smoothstep(.07,.01,d)*.55);
    // agujeros quemados por delante del borde, con brasa en el contorno
    float hn=fbm(ap*34.+7.),th=mix(.95,.5,smoothstep(.09,0.,d));
    float rim=smoothstep(th-.05,th,hn),hole=smoothstep(th,th+.015,hn);
    col=mix(col,vec3(.1,.04,.04),hole);
    col+=orng*rim*(1.-hole)*smoothstep(.09,0.,d)*(.55+.45*sin(T*7.+hn*40.))*1.1;
    // brasas sueltas a lo largo del borde y leve calor en el papel
    float sm=smoothstep(.5,.8,fbm(ap*16.+T*.5));
    col+=ramp(.5+.4*grain)*exp(-d*70.)*sm*1.2;
    float rimB=smoothstep(0.,.012,d)-smoothstep(.012,.035,d);   // brillo pegado al frente
    col=mix(col,ramp(.62+.38*(.5+.5*sin(T*9.+mid*14.))),clamp(rimB*sm,0.,1.));
    col=mix(col,vec3(.45,.9,.3),exp(-d*9.)*.18*(.6+.4*mid));
  }else{
    float depth=-d;
    float cool=smoothstep(.04,.3,depth);          // más lejos del frente = más frío = más gris
    // ceniza lisa y oscura con manchas suaves, sin trama
    col=vec3(.12,.05,.058)*(.8+.4*mid);

    // trozos de papel quemado que aún no se deshacen
    float n2=fbm(ap*30.+4.);
    float isl=smoothstep(.6,.63,n2)*smoothstep(.08,.015,depth);
    col=mix(col,vec3(.30,.26,.09)*(.6+.6*grain),isl*.9);
    col+=orng*(1.-smoothstep(.63,.68,n2))*isl*(.6+.4*sin(T*6.+n2*30.))*.9;

    // brasas pequeñas que se apagan detrás del frente
    float em=smoothstep(.72,.86,fbm(ap*28.+vec2(0.,T*.1)))*exp(-depth*9.)*(.55+.45*sin(T*4.+big*25.));
    col+=ramp(.5+.4*grain)*em*1.1;

    // línea de lava solo en el frente de la quema
    float line0=.07;
    float w=.005+.014*smoothstep(.45,.75,fbm(ap*5.+T*.1));
    float x=(depth-line0+(mid-.5)*.045)/w;
    float li=exp(-x*x)*(.85+.15*sin(T*9.+mid*14.));
    vec3 l2=ramp(li);
    float sat=(abs(l2.r-l2.g)+abs(l2.r-l2.b)+abs(l2.b-l2.g))/3.;
    col=mix(col,l2,clamp(li*1.3,0.,1.));
    col+=l2*sat*li*1.4;                                      // emisión: más saturado = más luz
    col+=red*exp(-abs(depth-line0)*22.)*.28*(.5+.5*mid);   // calor sobre la ceniza
    a=1.-smoothstep(.16,.42,depth);   // se funde con la página negra
    if(a<.01)discard;
  }
  fragColor=vec4(min(col,vec3(1.)),a);
}`;

function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(o));return null}return o}
function initGL(){
  gl=glC.getContext("webgl2",{alpha:true,premultipliedAlpha:false,antialias:true});
  if(!gl)return false;
  prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){console.error(gl.getProgramInfoLog(prog));return false}
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const l=gl.getAttribLocation(prog,"a_pos");gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
  U=Object.fromEntries(["u_time","u_spread","u_aspect","u_clock","u_origin","u_tex"].map(n=>[n,gl.getUniformLocation(prog,n)]));
  gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  tex=gl.createTexture();gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);
  [gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,k,gl.LINEAR));
  [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,k,gl.CLAMP_TO_EDGE));
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array(4));
  gl.uniform1i(U.u_tex,0);
  // dibujo de prueba de 1 px: fuerza la compilación del shader ahora y no en el primer fotograma de la quema
  gl.viewport(0,0,1,1);gl.uniform1f(U.u_time,.4);gl.uniform1f(U.u_spread,SP);gl.uniform1f(U.u_aspect,1);gl.uniform1f(U.u_clock,0);gl.uniform2f(U.u_origin,.5,.5);
  gl.drawArrays(gl.TRIANGLES,0,3);gl.finish();
  return true;
}

// Partículas: trozos de papel que salen disparados + brasas que suben
const FLECK=["#5f5a2a","#2b2812","#6B6064","#E8E7E3","#8a8a3a"];
class P{
  constructor(x,y,k,a=0){
    this.x=x;this.y=y;this.k=k;this.life=1;
    if(k==="fleck"){
      const s=.4+Math.random()*1.6;
      this.vx=Math.cos(a)*s+(Math.random()-.5)*.6;this.vy=Math.sin(a)*s-.5-Math.random()*.8;
      this.big=Math.random()<.22;this.dec=.006+Math.random()*.01;this.sz=this.big?5+Math.random()*7:1+Math.random()*3.5;this.fl=Math.random()*6.3;this.fv=(Math.random()-.5)*.15;this.age=0;this.b0=Math.random()*.35;this.ph=Math.random()*9;this.holes=Array.from({length:2},()=>[(Math.random()-.5)*.8,(Math.random()-.5)*.8,.1+Math.random()*.12]);
      this.rot=Math.random()*6.3;this.rv=(Math.random()-.5)*.2;this.c=this.big?["#36321a","#5f5a2a","#9a9a5c"][Math.random()*3|0]:FLECK[Math.random()*5|0];
      this.pts=Array.from({length:5},(_,i)=>{const an=i/5*6.283,r=.5+Math.random()*.7;return[Math.cos(an)*r,Math.sin(an)*r]});
    }else{
      this.vx=(Math.random()-.5)*.8;this.vy=-.4-Math.random()*1.6;
      this.dec=.004+Math.random()*.01;this.sz=.8+Math.random()*2;this.ph=Math.random()*9;
    }
  }
  update(dt){
    const s=dt*60;this.x+=this.vx*s;this.y+=this.vy*s;this.life-=this.dec*s;
    if(this.k==="fleck"){this.fl+=this.fv*s;this.age+=.006*s;this.ph+=.25*s;if(this.big&&Math.random()<.025*s)ps.push(new P(this.x,this.y,"ember"));this.rot+=this.rv*s;this.vy+=.006*s;this.vx*=.995}
    else{this.vx+=(Math.random()-.5)*.05*s;this.ph+=.2*s}
  }
  draw(c){
    if(this.life<=0)return;
    c.save();c.translate(this.x,this.y);
    if(this.k==="fleck"){
      const bn=Math.min(1,this.b0+this.age),z=this.sz*(1-.35*bn),A=Math.min(1,this.life*1.5);
      c.rotate(this.rot);c.scale(1,Math.max(.15,Math.abs(Math.cos(this.fl))));
      const mx=(p,q,t)=>p.map((v,i)=>v+(q[i]-v)*t);
      // papel -> tostado -> marrón -> carbón según cuánto lleva quemándose
      const cols=[[232,231,227],[160,152,86],[95,86,36],[25,22,10]];
      const f=bn*3,i0=Math.min(2,f|0),base=mx(cols[i0],cols[i0+1],f-i0),edge=mx(base,cols[3],.75);
      const g=c.createRadialGradient(0,0,0,0,0,z*1.3);
      g.addColorStop(0,`rgb(${base.map(Math.round)})`);g.addColorStop(.55,`rgb(${base.map(Math.round)})`);g.addColorStop(1,`rgb(${edge.map(Math.round)})`);
      c.globalAlpha=A;c.fillStyle=g;
      c.beginPath();this.pts.forEach(([x,y],i)=>i?c.lineTo(x*z,y*z):c.moveTo(x*z,y*z));c.closePath();c.fill();
      // canto encendido que parpadea mientras se consume
      const gl=(.35+.65*Math.abs(Math.sin(this.ph*1.3)))*(1-bn*.6)*A*(this.big?1:.7);
      c.globalCompositeOperation="lighter";
      c.strokeStyle=`rgba(0,154,10,${gl*.35})`;c.lineWidth=2.6;c.stroke();
      c.strokeStyle=`rgba(190,255,160,${gl*.8})`;c.lineWidth=.8;c.stroke();
      // agujeritos quemados en los trozos grandes
      if(this.big){c.globalCompositeOperation="source-over";this.holes.forEach(([x,y,r])=>{c.fillStyle="rgba(15,6,6,.85)";c.beginPath();c.arc(x*z,y*z,r*z,0,6.283);c.fill();c.strokeStyle=`rgba(2,223,0,${gl*.9})`;c.lineWidth=.7;c.stroke()})}
    }else{
      const a=Math.min(1,this.life)*(.7+.3*Math.sin(this.ph)),R=this.sz*5;
      c.globalCompositeOperation="lighter";
      const g=c.createRadialGradient(0,0,0,0,0,R);
      g.addColorStop(0,`rgba(2,223,0,${a*.5})`);g.addColorStop(1,"rgba(0,154,10,0)");
      c.fillStyle=g;c.beginPath();c.arc(0,0,R,0,6.283);c.fill();
      c.globalAlpha=a;c.fillStyle="#D9FFC7";c.beginPath();c.arc(0,0,this.sz*.7,0,6.283);c.fill();
    }
    c.restore();
  }
}
// punto sobre el anillo del frente (radio medio) con un desvío en unidades de alto de pantalla
function ring(t,off){const a=Math.random()*6.283,r=(t*SP+off)*H;return[org[0]*W+Math.cos(a)*r,org[1]*H+Math.sin(a)*r,a]}

// dibuja el título y el botón en un canvas 2D y lo sube como textura, para que se quemen con el papel
function uploadContent(r){
  const k=Math.min(dpr,1.5),cv=document.createElement("canvas");cv.width=W*k;cv.height=H*k;
  const c=cv.getContext("2d");c.scale(k,k);
  const t=document.querySelector(".title"),tr=t.getBoundingClientRect();
  c.font=getComputedStyle(t).font||"900 30px sans-serif";if("letterSpacing" in c)c.letterSpacing=getComputedStyle(t).letterSpacing;c.fillStyle="#210E10";c.textAlign="center";c.textBaseline="middle";
  c.fillText(t.textContent,tr.left+tr.width/2,tr.top+tr.height/2);
  const g=c.createLinearGradient(r.left,0,r.right,0);g.addColorStop(0,"#009A0A");g.addColorStop(.5,"#02DF00");g.addColorStop(1,"#D9FFC7");
  const R=r.height/2;c.fillStyle=g;c.beginPath();
  c.arc(r.left+R,r.top+R,R,Math.PI/2,Math.PI*1.5);c.arc(r.right-R,r.top+R,R,-Math.PI/2,Math.PI/2);c.closePath();c.fill();
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,cv);
}

function loop(ts){
  if(!last)last=ts;const dt=Math.min(.045,(ts-last)/1000);last=ts;
  for(let i=ps.length-1;i>=0;i--){ps[i].update(dt);if(ps[i].life<=0)ps.splice(i,1)}
  fx.clearRect(0,0,W,H);

  if(phase==="burning"){
    const t=(ts-t0)/1000/DUR;
    gl.viewport(0,0,glC.width,glC.height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(U.u_time,t);gl.uniform1f(U.u_spread,SP);gl.uniform1f(U.u_aspect,W/H);gl.uniform1f(U.u_clock,ts*.001);
    gl.uniform2f(U.u_origin,org[0],1-org[1]);
    gl.drawArrays(gl.TRIANGLES,0,3);
    const gx=Math.min(1,Math.max(0,(t-.12)/.6));$("galeria").style.opacity=String(gx*gx*(3-2*gx));

    if(t>.02&&t<1){
      if(ps.length<MAX_PS){
        for(let i=0;i<FLECK_N;i++){const[x,y,a]=ring(t,(Math.random()-.5)*.24);ps.push(new P(x,y,"fleck",a))}
        if(Math.random()<EMBER_P){const[x,y]=ring(t,-.07+(Math.random()-.5)*.3);ps.push(new P(x,y,"ember"))}
      }
    }
    if(t>=1){
      phase="done";page.style.display="none";glC.style.display="none";
      $("galeria").classList.add("visible");$("galeria").style.opacity="1";
      try{ localStorage.setItem('ferx_galeria_entered','1'); }catch(_){}
      try{ window.iniciarGaleria && window.iniciarGaleria(); }catch(e){ console.error('iniciarGaleria', e); }
      requestAnimationFrame(()=>{ Object.values(window.__galVivas||{}).forEach(v=>v.gal&&v.gal.wake&&v.gal.wake()); });
      const nEnd=IS_MOBILE?8:30;
      for(let i=0;i<nEnd;i++)ps.push(new P(Math.random()*W,Math.random()*H,"ember"));
    }
  }
  for(const p of ps)p.draw(fx);
  requestAnimationFrame(loop);
}
if(initGL())requestAnimationFrame(loop);else document.body.insertAdjacentHTML("beforeend","<p style='position:absolute;bottom:12px;left:12px;z-index:30;color:#FA5E4D;font-size:.8rem'>WebGL2 no disponible</p>");

function startEntry(auto=false){
  if(phase!=="idle")return;
  // El clic en Entrar es el gesto de usuario: aquí se pide el permiso del giroscopio (iOS)
  try{ enableGyro(); }catch(_){}
  phase="fire";hint.classList.add("hidden");btn.classList.add("active");
  const heatMs = IS_MOBILE ? (auto ? 70 : 90) : (auto ? 40 : 55);
  const toFade = IS_MOBILE ? (auto ? 420 : 700) : (auto ? 700 : 1100);
  const toHide = IS_MOBILE ? 280 : (auto ? 350 : 450);
  const toBurn = IS_MOBILE ? 420 : (auto ? 550 : 650);
  const heat=setInterval(()=>{
    if(phase!=="fire"){clearInterval(heat);return}
    if(ps.length>=MAX_PS)return;
    const r=btn.getBoundingClientRect();ps.push(new P(r.left+Math.random()*r.width,r.top+r.height/2,"ember"));
  },heatMs);
  setTimeout(()=>{
    phase="fade";btn.classList.add("fading");
    const r=btn.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    const nBurst=IS_MOBILE?5:14;
    for(let i=0;i<nBurst;i++)ps.push(new P(cx+(Math.random()-.5)*r.width,cy,"ember"));
    setTimeout(()=>{btn.style.visibility="hidden"},toHide);
    setTimeout(()=>{
      uploadContent(r);page.classList.add("burn");glC.style.display="block";org=[cx/W,cy/H];
      phase="burning";t0=performance.now();
    },toBurn);
  },toFade);
}

btn.addEventListener("click",()=>startEntry(false));

// Si el auto-enter no pudo pedir permiso (iOS exige gesto), el primer toque en la galería lo activa
document.addEventListener('pointerdown',function onceGyro(){
  if(window.__gyro&&window.__gyro.ok)return;
  if(phase==='done'||phase==='burning'){try{enableGyro()}catch(_){}}
},{passive:true});

// Si ya entró antes, lanza la animación de fuego sola (sin esperar el clic)
try{
  if(localStorage.getItem('ferx_galeria_entered')==='1'){
    window.__autoEnter=()=>setTimeout(()=>startEntry(true),120);
  }
}catch(_){}

<script>

  { image: 'https://picsum.photos/seed/1/800/600', text: 'Bridge' },

const VERTEX = `#version 300 es
in vec2 aPosition;
uniform vec2 uResolution;
uniform vec2 uCenter;
uniform vec2 uSize;
uniform float uAngle;
uniform float uPad;
uniform float uWave;
uniform float uWaveTime;
uniform float uFocal;
out vec2 vLocal;
void main() {
  vec2 local = aPosition * (uSize + 2.0 * uPad);
  vec2 unit = local / max(uSize, vec2(1.0));
  float z = uWave * (sin(unit.x * 4.0 + uWaveTime) + cos(unit.y * 2.0 + uWaveTime)) * 0.5;
  float depth = uFocal / max(uFocal - z, 1.0);
  float c = cos(uAngle);
  float s = sin(uAngle);
  vec2 turned = vec2(c * local.x - s * local.y, s * local.x + c * local.y);
  vLocal = local;
  gl_Position = vec4((uCenter + turned * depth) / (uResolution * 0.5), 0.0, 1.0);
}`;

const FRAGMENT = `#version 300 es
precision highp float;
uniform sampler2D uTexture;
uniform vec2 uResolution;
uniform vec2 uSize;
uniform float uRadius;
uniform float uImageAspect;
uniform float uReady;
uniform vec3 uPlaceholder;
uniform float uGray;
uniform float uDim;
uniform float uAlpha;
uniform float uRing;
uniform vec3 uRingColor;
uniform float uRingWidth;
uniform float uRingGap;
uniform float uFade;
uniform float uShadow;
uniform float uBlur;
uniform vec2 uShadowOffset;
in vec2 vLocal;
out vec4 outColor;

float roundBox(vec2 p, vec2 b, float r) {
  vec2 q = abs(p) - b + r;
  return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
}

float smoother(float x) {
  x = clamp(x, 0.0, 1.0);
  return x * x * x * (x * (x * 6.0 - 15.0) + 10.0);
}

float edgeFade() {
  if (uFade <= 0.0) return 1.0;
  float u = gl_FragCoord.x / uResolution.x;
  return smoother(u / uFade) * smoother((1.0 - u) / uFade);
}

void main() {
  vec2 extent = uSize * 0.5;
  if (uShadow > 0.0) {
    float d = roundBox(vLocal - uShadowOffset, extent, uRadius);
    float a = uShadow * (1.0 - smoothstep(-uBlur, uBlur, d)) * uAlpha * edgeFade();
    outColor = vec4(0.0, 0.0, 0.0, a);
    return;
  }
  float d = roundBox(vLocal, extent, uRadius);
  float pixel = max(length(vec2(dFdx(d), dFdy(d))), 1e-4);
  float cover = clamp(0.5 - d / pixel, 0.0, 1.0);
  vec2 uv = vLocal / uSize + 0.5;
  float aspect = uSize.x / uSize.y;
  vec2 crop = aspect > uImageAspect ? vec2(1.0, uImageAspect / aspect) : vec2(aspect / uImageAspect, 1.0);
  vec3 image = texture(uTexture, (uv - 0.5) * crop + 0.5).rgb;
  vec3 color = mix(uPlaceholder, image, uReady);
  float luma = dot(color, vec3(0.2126, 0.7152, 0.0722));
  color = mix(color, vec3(luma), uGray) * (1.0 - uDim);
  float body = cover * mix(0.08, 1.0, uReady);
  float band = abs(d - uRingGap - uRingWidth * 0.5) - uRingWidth * 0.5;
  float ring = clamp(0.5 - band / pixel, 0.0, 1.0) * uRing;
  vec4 card = vec4(color * body, body);
  vec4 outline = vec4(uRingColor * ring, ring);
  outColor = (card + outline * (1.0 - card.a)) * uAlpha * edgeFade();
}`;

const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
const mix = (a, b, t) => a + (b - a) * t;
const ease = value => value * value * (3 - 2 * value);
const wrap = (value, length) => ((value % length) + length) % length;

function deriveFontFamilyFromUrl(url) {
  const fileName = (url.split('/').pop() || 'custom-font').split('?')[0];
  const base = fileName.replace(/\.(woff2?|ttf|otf|eot)$/i, '');
  return base.replace(/[^a-zA-Z0-9-_ ]/g, '').trim() || 'CircularGalleryFont';
}

async function loadFontFromStylesheet(url) {
  const response = await fetch(url);
  if (!response.ok) throw new Error(`Failed to fetch font stylesheet (${response.status})`);
  const cssText = await response.text();
  const faceBlocks = cssText.match(/@font-face\s*{[^}]*}/g) || [];
  let family = null;
  const fontFaces = [];
  for (const block of faceBlocks) {
    const familyMatch = block.match(/font-family:\s*['"]?([^;'"]+)['"]?/);
    const urlMatch = block.match(/url\(\s*['"]?([^'")]+)['"]?\s*\)/);
    if (!familyMatch || !urlMatch) continue;
    family = familyMatch[1].trim();
    const descriptors = {};
    const weightMatch = block.match(/font-weight:\s*([^;]+);/);
    const styleMatch = block.match(/font-style:\s*([^;]+);/);
    const rangeMatch = block.match(/unicode-range:\s*([^;]+);/);
    if (weightMatch) descriptors.weight = weightMatch[1].trim();
    if (styleMatch) descriptors.style = styleMatch[1].trim();
    if (rangeMatch) descriptors.unicodeRange = rangeMatch[1].trim();
    fontFaces.push(new FontFace(family, `url(${urlMatch[1]})`, descriptors));
  }
  if (!family) throw new Error('No @font-face rule found in the stylesheet');
  await Promise.allSettled(
    fontFaces.map(async face => {
      await face.load();
      document.fonts.add(face);
    })
  );
  return family;
}

async function loadFontFromFile(url) {
  const family = deriveFontFamilyFromUrl(url);
  const fontFace = new FontFace(family, `url(${url})`);
  await fontFace.load();
  document.fonts.add(fontFace);
  return family;
}

async function resolveFont(font, fontUrl) {
  const url = fontUrl || (font === DEFAULT_FONT ? DEFAULT_FONT_URL : null);
  if (!url) return font;
  try {
    const isStylesheet = url.includes('fonts.googleapis.com') || /\.css(\?.*)?$/i.test(url);
    const family = isStylesheet ? await loadFontFromStylesheet(url) : await loadFontFromFile(url);
    const sizeMatch = font.match(/^\s*(.*?\d+px)/);
    return `${sizeMatch ? sizeMatch[1].trim() : 'bold 30px'} "${family}"`;
  } catch {
    return font;
  }
}

const fontScale = font => {
  const match = String(font).match(/(\d+(?:\.\d+)?)px/);
  return match ? parseFloat(match[1]) / 30 : 1;
};

const compile = (gl, type, source) => {
  const shader = gl.createShader(type);
  if (!shader) return null;
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (gl.getShaderParameter(shader, gl.COMPILE_STATUS)) return shader;
  gl.deleteShader(shader);
  return null;
};

const link = gl => {
  const vertex = compile(gl, gl.VERTEX_SHADER, VERTEX);
  const fragment = compile(gl, gl.FRAGMENT_SHADER, FRAGMENT);
  const program = gl.createProgram();
  if (!vertex || !fragment || !program) return null;
  gl.attachShader(program, vertex);
  gl.attachShader(program, fragment);
  gl.bindAttribLocation(program, 0, 'aPosition');
  gl.linkProgram(program);
  gl.deleteShader(vertex);
  gl.deleteShader(fragment);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    gl.deleteProgram(program);
    return null;
  }
  const uniforms = {};
  const count = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < count; i++) {
    const info = gl.getActiveUniform(program, i);
    if (info) uniforms[info.name] = gl.getUniformLocation(program, info.name);
  }
  return { program, uniforms };
};

// Imagen de muestra generada en canvas (colores de tu paleta) para las piezas que aún no tienen archivo
function muestra(i) {
  const c = document.createElement('canvas'); c.width = 640; c.height = 820;
  const x = c.getContext('2d'), hue = [8, 18, 28, 38, 350, 330, 20, 45, 300, 60][i % 10];
  const g = x.createLinearGradient(0, 0, 640, 820);
  g.addColorStop(0, `hsl(${hue},75%,58%)`); g.addColorStop(.55, `hsl(${hue + 20},55%,24%)`); g.addColorStop(1, '#210E10');
  x.fillStyle = g; x.fillRect(0, 0, 640, 820);
  x.globalAlpha = .14; x.fillStyle = '#FEECBC';
  for (let k = 0; k < 14; k++) { x.beginPath(); x.arc((k * 97 + i * 41) % 640, (k * 151 + i * 67) % 820, 30 + (k * 13) % 90, 0, 6.283); x.fill(); }
  return c.toDataURL('image/jpeg', .85);
}

(function () {
  const $ = id => document.getElementById(id);
  const rails = [
    { el: 'railFoto', key: 'foto', items: FOTOGRAFIAS, off: 0 },
    { el: 'railIlu',  key: 'ilu',  items: ILUSTRACIONES, off: 5 }
  ];
  const vivas = {};   // key -> { gal, activo }
  window.__galVivas = vivas;

  // Perfil según pantalla: teléfono vertical / horizontal / tablet / PC
  const perfil = () => {
    const w = innerWidth, h = innerHeight;
    if (w > h && h <= 520) return 'land';
    if (w <= 700) return 'phone';
    if (w <= 1024) return 'tablet';
    return 'desk';
  };
  const CFG = {
    // Teléfono: tarjetas grandes, poca curva, SIN fade lateral (conecta con el borde de la página)
    phone:  { itemSize: 1.55, bend: 1.15, gap: 0.12, font: '900 36px Figtree', fade: 0 },
    land:   { itemSize: 1.15, bend: 1.9,  gap: 0.18, font: '900 32px Figtree', fade: 0.08 },
    tablet: { itemSize: 1.1,  bend: 2.2,  gap: 0.2,  font: '900 32px Figtree', fade: 0.12 },
    desk:   { itemSize: 0.95, bend: 2.6,  gap: 0.26, font: '900 30px Figtree', fade: 0.18 }
  };
  let perfilActual = perfil();
  function crear(r, recrear) {
    const host = $(r.el);
    const cfg = CFG[perfilActual];
    if (!host) { console.error('rail missing', r.el); return; }
    // asegurar tamaño mínimo aunque el contenedor aún anime
    if (host.clientHeight < 40) host.style.minHeight = '320px';
    const st = { gal: null, activo: r.items[0] };
    try {
      st.gal = CircularGallery(host, {
        items: r.items.map((p, i) => ({ ...p, image: p.image || muestra(r.off + i) })),
        bend: cfg.bend, textColor: '#FEECBC', borderRadius: 0.05, scrollEase: 0.05,
        fadeEdges: cfg.fade, itemSize: cfg.itemSize, gap: cfg.gap, intro: !recrear,
        dpr: Math.min(window.devicePixelRatio || 1, (perfilActual==='phone'||perfilActual==='land') ? 1.25 : 2),
        openOnClick: false,
        font: cfg.font, fontUrl: 'https://fonts.googleapis.com/css2?family=Figtree:wght@900&display=swap',
        onActiveChange: i => { st.activo = r.items[i]; },
        onItemClick: (item) => { window.openFlipCard && window.openFlipCard(item); }
      });
    } catch (e) {
      console.error('CircularGallery error', e);
      st.gal = null;
    }
    if (!st.gal) {
      host.textContent = 'No se pudo iniciar la galería (WebGL2)';
      console.warn('CircularGallery returned null for', r.key);
    } else {
      // API pública de wake si el engine la expone
      requestAnimationFrame(() => {
        try { st.gal.wake && st.gal.wake(); } catch(_){}
        window.dispatchEvent(new Event('resize'));
      });
    }
    vivas[r.key] = st;
  }
  // Se llama al TERMINAR la quema (host visible + tamaño real)
  window.iniciarGaleria = () => {
    if (vivas.foto) return;
    perfilActual = perfil();
    rails.forEach(r => crear(r));
  };
  // Al girar el teléfono o cambiar de tamaño la ventana, reajusta las tarjetas
  let rzT = 0;
  addEventListener('resize', () => {
    clearTimeout(rzT);
    rzT = setTimeout(() => {
      if (!vivas.foto) return;
      const p = perfil();
      if (p === perfilActual) return;
      perfilActual = p;
      Object.keys(vivas).forEach(k => {
        try { vivas[k].gal && vivas[k].gal.destroy && vivas[k].gal.destroy(); } catch (_) {}
        delete vivas[k];
      });
      rails.forEach(r => crear(r, true));
    }, 250);
  });

  // Parallax de las tarjetas con el giroscopio (sutil)
  (function railGyro(){
    const gy=window.__gyro||{beta:0,gamma:0};
    if(gy.ok){
      const rx=(gy.beta||0)*-0.12;
      const ry=(gy.gamma||0)*0.18;
      rails.forEach(r=>{
        const host=$(r.el);
        if(host) host.style.transform=`perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg)`;
      });
    }
    requestAnimationFrame(railGyro);
  })();

})();

// ===== Flip card (giro 3D con prompt) =====
(function(){
  const overlay = document.getElementById('flipOverlay');
  const card = document.getElementById('flipCard');
  const img = document.getElementById('flipImg');
  const title = document.getElementById('flipTitle');
  const backTitle = document.getElementById('flipBackTitle');
  const promptEl = document.getElementById('flipPrompt');
  const copyBtn = document.getElementById('flipCopyBtn');
  const backBtn = document.getElementById('flipBackBtn');
  const closeBtn = document.getElementById('flipClose');
  let currentText = '';
  let currentJson = '';
  let promptMode = 'normal';
  const flipMode = document.getElementById('flipMode');

  const tipsBtn = document.getElementById('flipTipsBtn');
  const demoSteps = document.getElementById('flipDemoSteps');
  const demoHint = document.getElementById('flipDemoHint');
  let tipsOpen = false;
  let cycleTimer = 0;

  // El prompt REAL se modifica en vivo: los ejemplos entran ARRIBA (no al final)
  function variants(base){
    const b = (base || '').trim();
    const body = escapeHtml(b);
    return [
      {
        html: body,
        hint: 'Prompt original. Este texto es el estilo/contexto de lo que vas a generar.'
      },
      {
        html: '<span class="hl hl-in">[a car scene on a mountain road at dusk]</span> ' + body,
        hint: 'La escena o entorno va arriba. Cámbiala por lo que quieras generar.'
      },
      {
        // Con imagen adjunta: solo la instrucción de transformar; el prompt ya es el estilo
        html: '<span class="hl hl-in">[image attached1] transform this attached image</span> ' + body,
        hint: 'Si adjuntas una foto, basta con indicar la transformación. El resto del prompt es el estilo.'
      },
      {
        html: '<span class="hl hl-in">highly detailed, sharp focus, best quality</span> ' + body,
        hint: 'Términos de calidad en inglés, al inicio, suelen mejorar el resultado.'
      }
    ];
  }
  function escapeHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function playStep(i){
    if (promptMode === 'json') return;
    const steps = variants(currentText);
    const step = steps[Math.max(0, Math.min(i, steps.length-1))];
    promptEl.removeAttribute('data-json');
    promptEl.innerHTML = step.html;
    demoHint.textContent = step.hint;
    [...demoSteps.querySelectorAll('.flip-demo-step')].forEach(b=>{
      if(+b.dataset.step === i) b.setAttribute('data-active','');
      else b.removeAttribute('data-active');
    });
  }

  function setTips(open){
    tipsOpen = open;
    clearInterval(cycleTimer);
    if(open){
      tipsBtn.setAttribute('aria-expanded','true');
      demoSteps.setAttribute('data-open','');
      demoHint.setAttribute('data-open','');
      playStep(0);
      let n = 1;
      cycleTimer = setInterval(()=>{
        if(n >= 4){ clearInterval(cycleTimer); return; }
        playStep(n++);
      }, 2400);
    } else {
      tipsBtn.setAttribute('aria-expanded','false');
      demoSteps.removeAttribute('data-open');
      demoHint.removeAttribute('data-open');
      // vuelve al prompt activo (texto plano, sin HTML de consejos)
      renderPrompt();
    }
  }
  tipsBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    setTips(!tipsOpen);
  });
  demoSteps.addEventListener('click', (e)=>{
    const b = e.target.closest('.flip-demo-step');
    if(!b) return;
    e.stopPropagation();
    clearInterval(cycleTimer);
    playStep(+b.dataset.step);
  });

  function activePrompt(){
    return promptMode === 'json' && currentJson ? currentJson : currentText;
  }
  function renderPrompt(){
    const text = activePrompt();
    if (tipsOpen) {
      // si consejos está abierto, re-aplica el paso actual sobre el texto base normal
      // (los consejos solo aplican al prompt normal)
      if (promptMode === 'json') {
        promptEl.textContent = currentJson;
        promptEl.setAttribute('data-json','');
      } else {
        promptEl.removeAttribute('data-json');
        // playStep se encarga si tipsOpen
      }
    } else {
      promptEl.textContent = text;
      if (promptMode === 'json') promptEl.setAttribute('data-json','');
      else promptEl.removeAttribute('data-json');
    }
  }
  function setPromptMode(mode){
    promptMode = mode;
    [...flipMode.querySelectorAll('button')].forEach(b=>{
      if (b.dataset.mode === mode) b.setAttribute('data-active','');
      else b.removeAttribute('data-active');
    });
    // consejos solo tienen sentido en modo normal
    if (mode === 'json' && tipsOpen) setTips(false);
    tipsBtn.style.visibility = mode === 'json' ? 'hidden' : '';
    renderPrompt();
    if (mode === 'normal' && tipsOpen) playStep(0);
  }
  flipMode.addEventListener('click', (e)=>{
    const b = e.target.closest('button[data-mode]');
    if (!b) return;
    e.stopPropagation();
    setPromptMode(b.dataset.mode);
  });

  function openFlipCard(item){
    if(!item) return;
    currentText = item.description || '';
    currentJson = item.promptJson || '';
    title.textContent = item.text || '';
    backTitle.textContent = item.text || '';
    const src = item.image || '';
    if (src) {
      img.src = src;
      img.style.display = '';
    } else {
      img.removeAttribute('src');
      img.style.display = 'none';
    }
    img.alt = item.text || '';
    if (currentJson) flipMode.setAttribute('data-show','');
    else flipMode.removeAttribute('data-show');
    setTips(false);
    setPromptMode('normal');
    card.removeAttribute('data-flipped');
    copyBtn.removeAttribute('data-ok');
    copyBtn.textContent = 'Copiar prompt';
    overlay.setAttribute('data-open','');
    overlay.setAttribute('aria-hidden','false');
  }
  window.openFlipCard = openFlipCard;

  function closeFlip(){
    overlay.removeAttribute('data-open');
    overlay.setAttribute('aria-hidden','true');
    card.removeAttribute('data-flipped');
    setTips(false);
  }

  // Clic en el frente → voltear al prompt (inspeccionar foto primero)
  card.querySelector('.flip-front').addEventListener('click', ()=>{
    card.setAttribute('data-flipped','');
  });
  // Botón Volver o clic en el reverso (fuera de botones) → regresar a la foto
  backBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    card.removeAttribute('data-flipped');
  });
  closeBtn.addEventListener('click', closeFlip);
  overlay.addEventListener('click', (e)=>{
    if(e.target === overlay) closeFlip();
  });
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape' && overlay.hasAttribute('data-open')) closeFlip();
  });

  async function copiar(texto){
    const text = String(texto || '');
    // 1) API moderna
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (_) {}
    // 2) Fallback textarea (funciona también en file://)
    try {
      const t = document.createElement('textarea');
      t.value = text;
      t.setAttribute('readonly','');
      t.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;padding:0;border:0;opacity:0;';
      document.body.appendChild(t);
      t.focus();
      t.select();
      t.setSelectionRange(0, text.length);
      const ok = document.execCommand('copy');
      t.remove();
      if (ok) return true;
    } catch (_) {}
    // 3) Último recurso: selección del propio prompt visible
    try {
      const range = document.createRange();
      range.selectNodeContents(promptEl);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      const ok = document.execCommand('copy');
      sel.removeAllRanges();
      if (ok) return true;
    } catch (_) {}
    return false;
  }
  copyBtn.addEventListener('click', async (e)=>{
    e.preventDefault();
    e.stopPropagation();
    // copia la versión activa (normal o JSON), nunca los ejemplos de consejos
    const ok = await copiar(activePrompt());
    if (ok) {
      copyBtn.setAttribute('data-ok','');
      copyBtn.textContent = '¡Copiado!';
      setTimeout(()=>{ copyBtn.removeAttribute('data-ok'); copyBtn.textContent='Copiar prompt'; }, 1600);
    } else {
      copyBtn.textContent = 'Selecciona y Ctrl+C';
      setTimeout(()=>{ copyBtn.textContent='Copiar prompt'; }, 2000);
    }
  });
})();

// ---------- texturas procedurales ----------
function rnd(a,b){return a+Math.random()*(b-a)}
function woodTextures(P){
  const W=1024,H=1024,col=document.createElement('canvas'),bmp=document.createElement('canvas');
  col.width=bmp.width=W;col.height=bmp.height=H;
  const cx=col.getContext('2d'),bx=bmp.getContext('2d'),ci=cx.createImageData(W,H),bi=bx.createImageData(W,H);
  const sd=(Math.random()*1e6)|0;
  const h2=(i,j)=>{let n=(Math.imul(i,374761393)+Math.imul(j,668265263)+sd)|0;n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967296};
  const sm=t=>t*t*(3-2*t);
  function vn(x,y,per){const xi=Math.floor(x),yi=Math.floor(y),fx=sm(x-xi),fy=sm(y-yi);
    const x0=((xi%per)+per)%per,x1=(x0+1)%per,a=h2(x0,yi),b=h2(x1,yi),c=h2(x0,yi+1),d=h2(x1,yi+1);
    const t=a+(b-a)*fx,u=c+(d-c)*fx;return t+(u-t)*fy;}
  function fbm(u,v,cx0,cy0){let s=0,a=.5,k=1;for(let o=0;o<4;o++){s+=a*vn(u*cx0*k,v*cy0*k,cx0*k);k*=2;a*=.5}return s/.9375}
  for(let y=0;y<H;y++){const v=y/H;
    for(let x=0;x<W;x++){
      const u=x/W,c1=fbm(u,v,3,3),c2=fbm(u+.3,v,7,7),g=h2(x,y)-.5,st=(vn(u*3,y*.35,3)-.5)*.05;
      const pore=h2(x,y+99991)>.9988?.3:0;
      const f=1+(c1-.5)*.26+(c2-.5)*.1+g*.05+st-pore,i=(y*W+x)*4;
      ci.data[i]=Math.min(255,138*f);ci.data[i+1]=Math.min(255,133*f);ci.data[i+2]=Math.min(255,126*f);ci.data[i+3]=255;
      const b=Math.max(0,Math.min(255,128+(c2-.5)*50+g*14-pore*160));bi.data[i]=bi.data[i+1]=bi.data[i+2]=b;bi.data[i+3]=255;

function paperTexture(lines,aged){

// ---------- lámpara ----------
const black=new THREE.MeshStandardMaterial({color:0x08080a,roughness:.28,metalness:.85});
const lamp=new THREE.Group();lamp.visible=false;
const base=new THREE.Mesh(new THREE.CylinderGeometry(.2,.23,.055,48),black);base.position.y=.028;base.castShadow=true;lamp.add(base);
const dome=new THREE.Mesh(new THREE.SphereGeometry(.16,32,12,0,Math.PI*2,0,Math.PI/2),black);dome.scale.set(1,.6,1);dome.position.y=.056;lamp.add(dome);
const curve=new THREE.CatmullRomCurve3([new THREE.Vector3(0,.07,0),new THREE.Vector3(-.03,.45,.0),new THREE.Vector3(.04,.85,.05),new THREE.Vector3(.2,1.12,.08),new THREE.Vector3(.36,1.2,.1)]);
const arm=new THREE.Mesh(new THREE.TubeGeometry(curve,40,.018,10),black);arm.castShadow=true;lamp.add(arm);
const head=new THREE.Group();head.position.set(.38,1.17,.1);lamp.add(head);
const tilt=new THREE.Group();tilt.rotation.z=-.62;head.add(tilt);
const shade=new THREE.Mesh(new THREE.SphereGeometry(.24,48,24,0,Math.PI*2,0,Math.PI/2),
  new THREE.MeshStandardMaterial({color:0x0a0a0c,roughness:.22,metalness:.9,side:THREE.DoubleSide}));
shade.scale.set(1,.85,1);tilt.add(shade);
const knob=new THREE.Mesh(new THREE.SphereGeometry(.03,16,16),black);knob.position.y=.2;tilt.add(knob);
const bulb=new THREE.Mesh(new THREE.SphereGeometry(.05,16,16),new THREE.MeshBasicMaterial({color:0xfff0c8}));bulb.position.y=.02;tilt.add(bulb);

// ---------- luces ----------
scene.add(new THREE.AmbientLight(0x1a1410,.35));
const spot=new THREE.SpotLight(0xffe2b8,5.5,14,.6,1,1.4);
const spotPos=new THREE.Vector3();
head.updateWorldMatrix(true,false);
spot.position.set(.1,.06,0);
spot.target.position.set(0,-.08,-5);
spot.castShadow=true;spot.shadow.mapSize.set(LOW?1024:2048,LOW?1024:2048);spot.shadow.bias=-.0004;spot.shadow.radius=4;
scene.add(camera);camera.add(spot,spot.target);
const fill=new THREE.PointLight(0xffb36b,.08,5,2);fill.position.set(.4,.6,.2);world.add(fill);
const rimL=new THREE.PointLight(0x4f6a8f,.12,10,2);rimL.position.set(3,2,-2);world.add(rimL);

// ---------- polvo ----------
const N=LOW?600:1100,pos=new Float32Array(N*3),seed=new Float32Array(N*4);
for(let i=0;i<N;i++){
  pos[i*3]=rnd(-2.6,2.6);pos[i*3+1]=rnd(0,1.4);pos[i*3+2]=rnd(-1.8,1.8);
  seed[i*4]=Math.random()*6.28;seed[i*4+1]=rnd(.4,1.2);seed[i*4+2]=Math.random();seed[i*4+3]=Math.random()*6.28;
}
const dg=new THREE.BufferGeometry();
dg.setAttribute('position',new THREE.BufferAttribute(pos,3));
dg.setAttribute('aSeed',new THREE.BufferAttribute(seed,4));
const dustMat=new THREE.ShaderMaterial({
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  uniforms:{uTime:{value:0},uLamp:{value:new THREE.Vector3()},uDir:{value:new THREE.Vector3()},uScale:{value:600}},
  vertexShader:`
    attribute vec4 aSeed;uniform float uTime;uniform vec3 uLamp;uniform vec3 uDir;uniform float uScale;
    varying float vI;varying float vTw;
    void main(){
      vec3 p=position;float t=uTime*aSeed.y;
      p.x+=sin(t*.35+aSeed.x)*.28+sin(t*.9+aSeed.w)*.05;
      p.z+=cos(t*.3+aSeed.w)*.28+cos(t*.8+aSeed.x)*.05;
      p.y=mod(p.y+uTime*.018*aSeed.y+sin(t*.5+aSeed.x)*.06,1.4);
      vec3 d=p-uLamp;float L=length(d);d/=L;
      float cone=smoothstep(.78,.97,dot(d,uDir));
      float fall=1./(1.+L*L*.06);
      float edge=smoothstep(0.,.15,p.y)*smoothstep(1.4,1.1,p.y);
      vTw=.75+.25*sin(uTime*(1.+aSeed.z*2.)+aSeed.x*5.);
      vI=cone*fall*edge*(.35+aSeed.z*.9);
      vec4 mv=modelViewMatrix*vec4(p,1.);
      gl_PointSize=min((.018+aSeed.z*.028)*uScale/-mv.z,6.);
      gl_Position=projectionMatrix*mv;
    }`,
  fragmentShader:`
    varying float vI;varying float vTw;
    void main(){
      vec2 uv=gl_PointCoord-.5;float r=length(uv)*2.;
      float core=smoothstep(1.,.55,r);float halo=smoothstep(1.,0.,r)*.25;
      float a=(core+halo)*vI*vTw;
      if(a<.005)discard;
      gl_FragColor=vec4(vec3(1.,.86,.62)*a*.55,a);
    }`
});
const dust=new THREE.Points(dg,dustMat);dust.frustumCulled=false;world.add(dust);

// ---------- cámara / scroll ----------
const ttl=(function(){const cv=document.createElement('canvas');cv.width=2048;cv.height=512;const c=cv.getContext('2d');
  c.shadowColor='rgba(255,255,255,.9)';c.shadowBlur=34;c.fillStyle='#fff';c.font='bold 240px "Helvetica Neue",Helvetica,Arial,sans-serif';c.textBaseline='middle';
  const txt='FERXDESING',sp=16;let w=-sp;for(const ch of txt)w+=c.measureText(ch).width+sp;
  let x=(2048-w)/2;for(const ch of txt){c.fillText(ch,x,262);x+=c.measureText(ch).width+sp}
  const tex=new THREE.CanvasTexture(cv);tex.encoding=THREE.sRGBEncoding;tex.anisotropy=8;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(1,.25),new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{map:{value:tex},uTime:{value:0}},vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'uniform sampler2D map;uniform float uTime;varying vec2 vUv;void main(){float p=fract(uTime/3.);float pos=mix(-.3,1.3,clamp(p/.45,0.,1.));float d=vUv.x-vUv.y*.25-pos;float b=exp(-d*d*180.);vec4 s=texture2D(map,vUv);gl_FragColor=vec4(vec3(1.),s.a*(.45+.5*b));}'}));
  m.position.set(-4.3,.26,0);m.rotation.y=Math.PI/2;world.add(m);return m})();
let target=0,prog=0,vel=0,lastProg=0;
const scrollEl=window.sceneScrollEl||null;   // si la escena es fondo de otra página, el progreso sale del scroll de ese elemento
function onScroll(){if(scrollEl){const m=scrollEl.scrollHeight-scrollEl.clientHeight;target=m>0?scrollEl.scrollTop/m:0;return}const m=document.documentElement.scrollHeight-innerHeight;target=m>0?scrollY/m:0}
(scrollEl||window).addEventListener('scroll',onScroll,{passive:true});onScroll();
function resize(){
  const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  camera.fov=w<h?52:38;camera.updateProjectionMatrix();
  {const hh=Math.tan(camera.fov*Math.PI/360)*camera.aspect;ottoDist=w<h?1.15:.9;ottoZ=-ottoDist*hh*.4}   // Otto queda dentro del encuadre en cualquier proporción
  dustMat.uniforms.uScale.value=h*.55*renderer.getPixelRatio();ttl.scale.setScalar(Math.min(1,w/h*.9));
}
addEventListener('resize',resize);resize();

const clock=new THREE.Clock();
const lampWorld=new THREE.Vector3(),dir=new THREE.Vector3();
let warm=2;
function frame(){
  if(typeof phase!=='undefined'&&phase==='idle'&&warm--<=0){requestAnimationFrame(frame);return}
  const t=clock.getElapsedTime();
  prog+=(target-prog)*.05;vel+=((prog-lastProg)*60-vel)*.1;lastProg=prog;
  const sw=Math.sin(prog*Math.PI*2),sc=Math.cos(prog*Math.PI*1.4);
  // vaivén sutil + respiración + giroscopio (móvil)
  const gy=window.__gyro||{beta:0,gamma:0};
  const gX=(gy.beta||0)*0.0018;   // inclinar teléfono → cámara sube/baja
  const gY=(gy.gamma||0)*0.0022;  // girar → cámara mira a los lados
  camera.position.set(-3.2+prog*7.1+Math.sin(t*.4)*.012, .21+prog*.09+Math.sin(t*.6)*.005+gX*.15, sw*.1+Math.cos(t*.35)*.01+gY*.2);
  dust.position.x=camera.position.x-2.6;
  camera.rotation.x=-.015+sc*.012+vel*.01+gX;
  camera.rotation.y=Math.PI/2+sw*.035+gY;
  camera.rotation.z=sw*.012+Math.sin(t*.3)*.002+gY*.25;
  // parpadeo muy leve de la luz
  spot.intensity=5.5+Math.sin(t*5.1)*.03;
  // luz del polvo en espacio del mundo (grupo rotado)
  camera.updateMatrixWorld();world.updateMatrixWorld();
  lampWorld.copy(world.worldToLocal(camera.localToWorld(spot.position.clone())));
  dir.copy(world.worldToLocal(camera.localToWorld(spot.target.position.clone()))).sub(lampWorld).normalize();
  dustMat.uniforms.uLamp.value.copy(lampWorld).sub(dust.position);dustMat.uniforms.uDir.value.copy(dir);
  dustMat.uniforms.uTime.value=t;ttl.material.uniforms.uTime.value=t;
  ottoTick(t);
  renderer.render(scene,camera);requestAnimationFrame(frame);
}
window.__sceneWarm=function(){try{ottoTick(clock.getElapsedTime())}catch(_){}camera.updateMatrixWorld();renderer.render(scene,camera);renderer.render(scene,camera)};
frame();
})();
</script>
<script>
// ===== Pantalla de carga: fuentes, imágenes, Otto, shaders y galería se preparan antes de mostrar nada =====
(function(){
  const bar=document.getElementById('ldBar'),txt=document.getElementById('ldTxt'),L=document.getElementById('loader');
  const PESO={fuentes:5,imagenes:30,otto:40,galeria:25},hecho={fuentes:0,imagenes:0,otto:0,galeria:0};
  let shown=0,fakeOtto=0,allDone=false,finished=false;
  const wt=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(r,ms))]).catch(()=>{});

  const fuentes=wt(Promise.all([document.fonts.load('900 30px Figtree'),document.fonts.ready]),4000).then(()=>{hecho.fuentes=1});

  let urls=[];try{urls=[...FOTOGRAFIAS,...ILUSTRACIONES].map(i=>i.image).filter(Boolean)}catch(_){}
  let n=0;
  const imagenes=urls.length?Promise.all(urls.map(u=>wt(new Promise(res=>{
    const im=new Image();im.crossOrigin='anonymous';im.decoding='async';im.onload=im.onerror=()=>res();im.src=u;
  }),10000).then(()=>{n++;hecho.imagenes=n/urls.length}))):Promise.resolve().then(()=>{hecho.imagenes=1});

  const otto=wt(window.__ottoReady||Promise.resolve(),15000).then(()=>{
    try{window.__sceneWarm&&window.__sceneWarm()}catch(e){console.error(e)}   // compila los shaders de la escena 3D
    hecho.otto=1;
  });

  function calentarQuema(){   // un dibujo de prueba para que el shader del fuego quede compilado
    try{
      if(typeof gl==='undefined'||!gl||typeof U==='undefined'||!U)return;
      gl.viewport(0,0,glC.width,glC.height);
      gl.uniform1f(U.u_time,.5);gl.uniform1f(U.u_spread,SP);gl.uniform1f(U.u_aspect,innerWidth/innerHeight);gl.uniform1f(U.u_clock,0);gl.uniform2f(U.u_origin,.5,.5);
      gl.drawArrays(gl.TRIANGLES,0,3);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
    }catch(_){}
  }
  // las ruletas se crean ya (con imágenes en caché) para que no haya tirones al terminar la quema
  const galeria=Promise.all([fuentes,imagenes]).then(()=>{
    try{window.iniciarGaleria&&window.iniciarGaleria()}catch(e){console.error(e)}
    return new Promise(r=>setTimeout(r,600));
  }).then(()=>{calentarQuema();hecho.galeria=1});

  Promise.all([fuentes,imagenes,otto,galeria]).then(()=>{allDone=true});

  function finish(){
    if(finished)return;finished=true;
    bar.style.transform='scaleX(1)';txt.textContent='Listo';L.classList.add('done');
    setTimeout(()=>{L.style.display='none';try{window.__autoEnter&&window.__autoEnter()}catch(_){}},650);
  }
  (function tick(){
    if(finished)return;
    if(!hecho.otto)fakeOtto=Math.min(.9,fakeOtto+.004);
    let t=0;for(const k in PESO)t+=PESO[k]*(k==='otto'?Math.max(hecho.otto,fakeOtto):hecho[k]);
    const target=allDone?1:Math.min(.97,t/100);
    shown+=(target-shown)*.12;
    bar.style.transform='scaleX('+shown+')';txt.textContent='Cargando… '+Math.round(shown*100)+'%';
    if(allDone&&shown>.985)finish();
    requestAnimationFrame(tick);
  })();
  setTimeout(finish,20000);   // seguridad: si algo tarda de más, se muestra igual
})();
</script>
